name: scorecast
description: Live sports scores with native Android home-screen widgets.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # THE native bridge: writes to the SharedPreferences file the Glance widget reads,
  # and triggers widget re-render. (Android writes to "HomeWidgetPreferences".)
  home_widget: ^0.7.0

  # Push: silent score updates from the C# backend.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Routing + deep links (app://match/{id}).
  go_router: ^14.2.7
  app_links: ^6.3.2

  # State.
  provider: ^6.1.2

  # Backend API client.
  http: ^1.2.2

  # Optional: local notifications when data["notify"] == "true".
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# NOTE: versions are recent known-good majors. Run `flutter pub get` (or
# `flutter pub upgrade --major-versions`) to resolve exact latest for your SDK.
